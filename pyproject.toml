[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xai-perturbation-research"
version = "0.1.0"
description = "Reproducible research code for learned perturbation-based image explanations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=1.26",
  "torch>=2.4",
  "torchmetrics>=1.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xai_perturbation"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
